<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const l = window.location;
        const segmentCount = 1;
        const repoBase = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
        const routePath = l.pathname
          .slice(1)
          .split('/')
          .slice(segmentCount)
          .join('/');
        const search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        const target =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          repoBase +
          '/?/' +
          routePath.replace(/&/g, '~and~') +
          search +
          l.hash;

        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
